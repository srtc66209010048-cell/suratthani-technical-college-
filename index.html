<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบเช็คกิจกรรมนักศึกษา | University Activity System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #003366; /* สีน้ำเงินกรมท่า มหาลัย */
            --light-blue: #0056b3;
            --soft-bg: #f4f7f9;
            --white: #ffffff;
            --text-dark: #2c3e50;
            --text-light: #7f8c8d;
            --border-color: #e0e6ed;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: var(--soft-bg);
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ตกแต่งพื้นหลังให้ดูมีมิติแบบ Minimal */
        .bg-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 0% 0%, #e0eafc 0%, #cfdef3 100%);
        }

        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background: white;
            opacity: 0.5;
            filter: blur(80px);
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header Area */
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .college-logo {
            width: 90px;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        .login-header h1 {
            font-size: 1.5rem;
            color: var(--primary-blue);
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .login-header p {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-top: 5px;
        }

        /* Login Card */
        .login-card {
            background: var(--white);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 51, 102, 0.08);
            border: 1px solid var(--white);
        }

        /* Tabs Styling */
        .login-tabs {
            display: flex;
            background: #f8fafd;
            padding: 5px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
        }

        .login-tab {
            flex: 1;
            padding: 10px 5px;
            text-align: center;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            color: var(--text-light);
            font-weight: 400;
        }

        .login-tab.active {
            background: var(--white);
            color: var(--primary-blue);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            font-weight: 500;
        }

        /* Form Controls */
        .login-form {
            display: none;
        }

        .login-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: var(--text-dark);
            font-weight: 400;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #bdc3c7;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px 12px 42px;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #fcfdfe;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-blue);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(0, 51, 102, 0.05);
        }

        /* Password Toggle */
        .toggle-pass {
            position: absolute;
            right: 15px;
            left: auto !important;
            cursor: pointer;
            color: #95a5a6 !important;
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: var(--primary-blue);
            color: white;
        }

        .btn-primary:hover {
            background: var(--light-blue);
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(0, 51, 102, 0.2);
        }

        /* Footer */
        .footer-text {
            text-align: center;
            margin-top: 30px;
            font-size: 0.8rem;
            color: var(--text-light);
        }

        /* Mobile Responsive */
        @media (max-width: 480px) {
            .login-card {
                padding: 30px 20px;
            }
            .login-header h1 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <div class="bg-decoration">
        <div class="bg-circle" style="width: 400px; height: 400px; top: -100px; right: -100px;"></div>
        <div class="bg-circle" style="width: 300px; height: 300px; bottom: -50px; left: -50px;"></div>
    </div>

    <div class="container">
        <div class="login-header">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQlux4lEQv32t2eZrG7RYiLbC1vAdlGIHCksA&s" alt="Logo" class="college-logo">
            <h1>ระบบเช็คกิจกรรมนักศึกษา</h1>
            <p>มหาวิทยาลัยเทคโนโลยีส่วนกลาง</p>
        </div>

        <div class="login-card">
            <div class="login-tabs">
                <div class="login-tab active" onclick="switchTab('student')">นักศึกษา</div>
                <div class="login-tab" onclick="switchTab('teacher')">อาจารย์</div>
                <div class="login-tab" onclick="switchTab('admin')">ผู้ดูแลระบบ</div>
            </div>

            <form id="studentForm" class="login-form active">
                <div class="form-group">
                    <label>รหัสนักศึกษา</label>
                    <div class="input-wrapper">
                        <i class="fas fa-id-card"></i>
                        <input type="text" placeholder="กรอกรหัสนักศึกษา" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>รหัสผ่าน</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="pass1" placeholder="••••••••" required>
                        <i class="fas fa-eye toggle-pass" onclick="toggleView('pass1')"></i>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">เข้าสู่ระบบ</button>
            </form>

            <form id="teacherForm" class="login-form">
                <div class="form-group">
                    <label>บัญชีผู้ใช้อาจารย์</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user-tie"></i>
                        <input type="text" placeholder="ชื่อผู้ใช้">
                    </div>
                </div>
                <div class="form-group">
                    <label>รหัสผ่าน</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="pass2" placeholder="••••••••">
                        <i class="fas fa-eye toggle-pass" onclick="toggleView('pass2')"></i>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">เข้าสู่ระบบอาจารย์</button>
            </form>

             <form id="adminForm" class="login-form">
                <div class="form-group">
                    <label>บัญชีผู้ดูแลระบบ</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user-shield"></i>
                        <input type="text" placeholder="Admin ID">
                    </div>
                </div>
                <div class="form-group">
                    <label>รหัสผ่าน</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="pass3" placeholder="••••••••">
                        <i class="fas fa-eye toggle-pass" onclick="toggleView('pass3')"></i>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" style="background: #2c3e50;">เข้าสู่ระบบ Admin</button>
            </form>
        </div>

        <div class="footer-text">
            &copy; 2026 University Activity Tracking System<br>
            ฝ่ายเทคโนโลยีสารสนเทศเพื่อการศึกษา
        </div>
    </div>

    <script>
        function switchTab(role) {
            // Remove active classes
            document.querySelectorAll('.login-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.login-form').forEach(form => form.classList.remove('active'));

            // Add active class to selected
            event.target.classList.add('active');
            document.getElementById(role + 'Form').classList.add('active');
        }

        function toggleView(id) {
            const input = document.getElementById(id);
            const icon = event.target;
            if (input.type === "password") {
                input.type = "text";
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = "password";
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
    </script>
</body>
</html>
