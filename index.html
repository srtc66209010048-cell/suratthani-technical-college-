<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คกิจกรรมนักเรียน | University Activity System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #1e3a8a;
            --secondary-blue: #3b82f6;
            --bg-light: #f8fafc;
            --text-main: #1e293b;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif; /* ฟอนต์ไม่มีหัว ทันสมัย */
        }

        body {
            background-color: var(--bg-light);
            background-image: radial-gradient(#e2e8f0 0.5px, transparent 0.5px);
            background-size: 20px 20px; /* ลาย Dot บางๆ ด้านหลัง */
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        /* ส่วนหัวที่เน้นความมินิมอล */
        .brand-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .college-logo {
            width: 90px;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        .brand-section h1 {
            font-size: 1.5rem;
            color: var(--primary-blue);
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .brand-section p {
            font-size: 0.9rem;
            color: #64748b;
            margin-top: 5px;
        }

        /* Card ล็อกอินแบบสะอาดตา */
        .login-card {
            background: var(--white);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        /* Tabs สไตล์ Apple/Modern */
        .login-tabs {
            display: flex;
            background: #f1f5f9;
            padding: 6px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .login-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
            color: #64748b;
        }

        .login-tab.active {
            background: var(--white);
            color: var(--primary-blue);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            font-weight: 500;
        }

        /* Input Fields */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: #475569;
            margin-left: 4px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: 0.3s;
            background: #fcfcfd;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--secondary-blue);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-primary {
            background: var(--primary-blue);
            color: white;
        }

        .btn-primary:hover {
            background: #172554;
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(30, 58, 138, 0.2);
        }

        /* ซ่อนฟอร์มที่ไม่เลือก */
        .login-form { display: none; }
        .login-form.active { display: block; animation: slideUp 0.4s ease-out; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-card { padding: 30px 20px; }
            .brand-section h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand-section">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQlux4lEQv32t2eZrG7RYiLbC1vAdlGIHCksA&s" alt="Logo" class="college-logo">
            <h1>ระบบเช็คกิจกรรม</h1>
            <p>วิทยาลัยอาชีวศึกษาเชียงใหม่</p>
        </div>

        <div class="login-card">
            <div class="login-tabs">
                <div class="login-tab active" onclick="switchTab('student')">นักเรียน</div>
                <div class="login-tab" onclick="switchTab('teacher')">อาจารย์</div>
                <div class="login-tab" onclick="switchTab('admin')">ผู้ดูแล</div>
            </div>

            <div id="studentForm" class="login-form active">
                <div class="form-group">
                    <label>รหัสนักเรียน</label>
                    <div class="input-wrapper">
                        <i class="fas fa-id-card"></i>
                        <input type="text" placeholder="STU-00000">
                    </div>
                </div>
                <div class="form-group">
                    <label>รหัสผ่าน</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" placeholder="••••••••">
                    </div>
                </div>
                <button class="btn btn-primary">เข้าสู่ระบบ</button>
            </div>

            </div>
    </div>

    <script>
        function switchTab(role) {
            // ลบ class active ออกจากทุก tab
            document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
            // เพิ่ม active ให้ tab ที่กด
            event.target.classList.add('active');
            
            // หมายเหตุ: คุณต้องไปเขียน JS สำหรับสลับฟอร์มเพิ่มเติมตาม ID ที่ตั้งไว้
            console.log("Switching to: " + role);
        }
    </script>
</body>
</html>
