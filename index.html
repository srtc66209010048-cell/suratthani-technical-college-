<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คกิจกรรมของนักเรียนในวิทยาลัย</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* --- CSS เดิมของคุณ --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-image: url('https://images.unsplash.com/photo-1523050854058-8df90110c9f1?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        /* --- ส่วนที่เพิ่ม/แก้ไขเพื่อให้รองรับกล้อง --- */
        .camera-viewport {
            width: 100%;
            aspect-ratio: 4/3;
            background: #2c3e50;
            border-radius: 12px;
            margin-bottom: 20px;
            overflow: hidden;
            position: relative;
            border: 3px solid #3498db;
        }

        video, canvas, #preview-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        #preview-img {
            display: none; /* ซ่อนรูปพรีวิวจนกว่าจะถ่าย */
        }

        .btn-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
            font-size: 1rem;
        }

        .btn-open { background: #95a5a6; color: white; }
        .btn-capture { background: #f39c12; color: white; }
        .btn-upload { background: #bdc3c7; color: #555; }
        .btn-retake { background: #7f8c8d; color: white; display: none; }
        .btn-submit { background: #27ae60; color: white; display: none; }

        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn:active { transform: scale(0.98); }

        i { width: 20px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2><i class="fas fa-camera"></i> ถ่ายรูปเช็คกิจกรรม</h2>

        <div class="camera-viewport">
            <video id="video" autoplay playsinline></video>
            <img id="preview-img" alt="Captured Photo">
            <canvas id="canvas" style="display:none;"></canvas>
        </div>

        <div class="btn-stack">
            <button id="btn-open" class="btn btn-open">
                <i class="fas fa-video"></i> เปิดกล้อง
            </button>

            <button id="btn-capture" class="btn btn-capture" disabled>
                <i class="fas fa-camera"></i> ถ่ายรูป
            </button>

            <button id="btn-upload" class="btn btn-upload">
                <i class="fas fa-upload"></i> อัปโหลดรูป
            </button>

            <button id="btn-retake" class="btn btn-retake">
                <i class="fas fa-redo"></i> ถ่ายใหม่
            </button>

            <button id="btn-submit" class="btn btn-submit">
                <i class="fas fa-paper-plane"></i> ส่งรูปให้อาจารย์
            </button>
        </div>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const previewImg = document.getElementById('preview-img');
    
    const btnOpen = document.getElementById('btn-open');
    const btnCapture = document.getElementById('btn-capture');
    const btnRetake = document.getElementById('btn-retake');
    const btnSubmit = document.getElementById('btn-submit');
    const btnUpload = document.getElementById('btn-upload');

    let stream = null;

    // 1. ฟังก์ชันเปิดกล้อง
    btnOpen.addEventListener('click', async () => {
        try {
            stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user" }, // ใช้ "environment" หากต้องการกล้องหลัง
                audio: false 
            });
            video.srcObject = stream;
            
            btnOpen.innerHTML = '<i class="fas fa-check"></i> กล้องเปิดใช้งานแล้ว';
            btnOpen.disabled = true;
            btnCapture.disabled = false;
        } catch (err) {
            console.error("Camera error:", err);
            alert("ไม่สามารถเข้าถึงกล้องได้: โปรดตรวจสอบว่าคุณใช้ HTTPS หรืออนุญาตสิทธิ์การเข้าถึงกล้อง");
        }
    });

    // 2. ฟังก์ชันถ่ายรูป
    btnCapture.addEventListener('click', () => {
        const context = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // วาดภาพจาก Video ลงใน Canvas
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // แปลงภาพเป็น URL เพื่อแสดงผล
        const photoData = canvas.toDataURL('image/png');
        previewImg.src = photoData;
        
        // สลับ UI
        video.style.display = 'none';
        previewImg.style.display = 'block';
        
        btnCapture.style.display = 'none';
        btnUpload.style.display = 'none';
        btnRetake.style.display = 'flex';
        btnSubmit.style.display = 'flex';
    });

    // 3. ฟังก์ชันถ่ายใหม่
    btnRetake.addEventListener('click', () => {
        video.style.display = 'block';
        previewImg.style.display = 'none';
        
        btnCapture.style.display = 'flex';
        btnUpload.style.display = 'flex';
        btnRetake.style.display = 'none';
        btnSubmit.style.display = 'none';
    });

    // 4. ฟังก์ชันส่งรูป (ตัวอย่าง)
    btnSubmit.addEventListener('click', () => {
        alert("ระบบได้รับรูปภาพของคุณแล้ว!");
        // ตรงนี้คุณสามารถเพิ่มฟังก์ชันส่งไฟล์ไปยัง Server ต่อไปได้
    });
</script>

</body>
</html>
