<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คชื่อกิจกรรม - วิทยาลัยเทคนิคสุราษฎร์ธานี</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-page">
    <!-- พื้นหลังเอฟเฟกต์ -->
    <div class="login-background-overlay"></div>
    <div class="login-background-pattern"></div>
    <div class="floating-shapes">
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
    </div>

    <div class="container">
        <header>
            <div class="header-container">
                <div class="logo-container">
                    <img src="assets/logo.png" alt="โลโก้วิทยาลัยเทคนิคสุราษฎร์ธานี" class="college-logo">
                </div>
                <div class="header-text">
                    <h1><i class="fas fa-user-check"></i> ระบบเช็คชื่อกิจกรรม</h1>
                    <p>วิทยาลัยเทคนิคสุราษฎร์ธานี</p>
                </div>
            </div>
        </header>

        <div class="login-container">
            <div class="login-card">
                <h2>เข้าสู่ระบบ</h2>
                
                <div class="login-tabs mobile-tabs">
                    <div class="login-tab active" id="studentTab">นักเรียน</div>
                    <div class="login-tab" id="teacherTab">อาจารย์</div>
                    <div class="login-tab" id="adminTab">ผู้ดูแล</div>
                </div>

                <!-- ฟอร์มล็อกอินนักเรียน -->
                <div id="studentLoginForm" class="login-form active">
                    <div class="form-group">
                        <label for="studentUsername"><i class="fas fa-user-graduate"></i> รหัสนักเรียน</label>
                        <input type="text" id="studentUsername" placeholder="กรอกรหัสนักเรียน">
                    </div>
                    <div class="form-group">
                        <label for="studentPassword"><i class="fas fa-lock"></i> รหัสผ่าน</label>
                        <div class="input-with-icon">
                            <input type="password" id="studentPassword" placeholder="กรอกรหัสผ่าน">
                            <i class="fas fa-eye" id="toggleStudentPassword"></i>
                        </div>
                    </div>
                    <button class="btn btn-primary" id="studentLoginBtn">
                        <i class="fas fa-sign-in-alt"></i> เข้าสู่ระบบ
                    </button>
                </div>

                <!-- ฟอร์มล็อกอินอาจารย์ -->
                <div id="teacherLoginForm" class="login-form">
                    <div class="form-group">
                        <label for="teacherUsername"><i class="fas fa-chalkboard-teacher"></i> ชื่อผู้ใช้</label>
                        <input type="text" id="teacherUsername" placeholder="กรอกชื่อผู้ใช้">
                    </div>
                    <div class="form-group">
                        <label for="teacherPassword"><i class="fas fa-lock"></i> รหัสผ่าน</label>
                        <div class="input-with-icon">
                            <input type="password" id="teacherPassword" placeholder="กรอกรหัสผ่าน">
                            <i class="fas fa-eye" id="toggleTeacherPassword"></i>
                        </div>
                    </div>
                    <button class="btn btn-danger" id="teacherLoginBtn">
                        <i class="fas fa-sign-in-alt"></i> เข้าสู่ระบบ
                    </button>
                </div>

                <!-- ฟอร์มล็อกอิน Admin -->
                <div id="adminLoginForm" class="login-form">
                    <div class="form-group">
                        <label for="adminUsername"><i class="fas fa-user-shield"></i> ชื่อผู้ดูแล</label>
                        <input type="text" id="adminUsername" placeholder="กรอกชื่อผู้ดูแลระบบ">
                    </div>
                    <div class="form-group">
                        <label for="adminPassword"><i class="fas fa-lock"></i> รหัสผ่าน</label>
                        <div class="input-with-icon">
                            <input type="password" id="adminPassword" placeholder="กรอกรหัสผ่าน">
                            <i class="fas fa-eye" id="toggleAdminPassword"></i>
                        </div>
                    </div>
                    <button class="btn btn-purple" id="adminLoginBtn">
                        <i class="fas fa-sign-in-alt"></i> เข้าสู่ระบบ
                    </button>
                </div>

                <div class="form-links">
                    <a href="#" class="form-link">ลืมรหัสผ่าน?</a>
                    <span>|</span>
                    <a href="#" class="form-link">ติดต่อผู้ดูแลระบบ</a>
                </div>
            </div>
        </div>

        <footer class="footer">
            <p>วิทยาลัยเทคนิคสุราษฎร์ธานี &copy; 2024 - ระบบเช็คชื่อกิจกรรมด้วยการถ่ายรูปยืนยันตัวตน</p>
        </footer>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification"></div>

    <script src="script.js"></script>
    <script>
        // Initialize login page
        document.addEventListener('DOMContentLoaded', function() {
            // Switch tabs
            document.getElementById('studentTab').addEventListener('click', () => switchToTab('student'));
            document.getElementById('teacherTab').addEventListener('click', () => switchToTab('teacher'));
            document.getElementById('adminTab').addEventListener('click', () => switchToTab('admin'));

            // Login buttons
            document.getElementById('studentLoginBtn').addEventListener('click', loginStudent);
            document.getElementById('teacherLoginBtn').addEventListener('click', loginTeacher);
            document.getElementById('adminLoginBtn').addEventListener('click', loginAdmin);

            // Toggle password visibility
            document.getElementById('toggleStudentPassword').addEventListener('click', () => 
                togglePasswordVisibility('studentPassword', 'toggleStudentPassword'));
            document.getElementById('toggleTeacherPassword').addEventListener('click', () => 
                togglePasswordVisibility('teacherPassword', 'toggleTeacherPassword'));
            document.getElementById('toggleAdminPassword').addEventListener('click', () => 
                togglePasswordVisibility('adminPassword', 'toggleAdminPassword'));

            // Login with Enter key
            document.getElementById('studentUsername').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') loginStudent();
            });
            document.getElementById('studentPassword').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') loginStudent();
            });
            document.getElementById('teacherUsername').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') loginTeacher();
            });
            document.getElementById('teacherPassword').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') loginTeacher();
            });
            document.getElementById('adminUsername').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') loginAdmin();
            });
            document.getElementById('adminPassword').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') loginAdmin();
            });
        });

        // Redirect to respective pages after login
        function loginStudent() {
            // Implement actual login logic here
            window.location.href = 'student.html';
        }

        function loginTeacher() {
            window.location.href = 'teacher.html';
        }

        function loginAdmin() {
            window.location.href = 'admin.html';
        }

        function switchToTab(tabName) {
            // Reset all tabs
            ['student', 'teacher', 'admin'].forEach(tab => {
                document.getElementById(tab + 'Tab').classList.remove('active');
                document.getElementById(tab + 'LoginForm').classList.remove('active');
            });
            
            // Set active tab
            document.getElementById(tabName + 'Tab').classList.add('active');
            document.getElementById(tabName + 'LoginForm').classList.add('active');
        }

        function togglePasswordVisibility(inputId, toggleIconId) {
            const input = document.getElementById(inputId);
            const toggleIcon = document.getElementById(toggleIconId);
            
            if (input.type === 'password') {
                input.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
